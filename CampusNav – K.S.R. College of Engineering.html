<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CampusNav – K.S.R. College of Engineering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f1f3f8; --panel:#ffffff; --text:#1d2433; --muted:#5f6b7f; --line:#e3e7ef; --field:#f3f5fa;
  --primary:#1a73e8; --primary-ink:#ffffff; --primary-soft:#e7f0fe;
  --map-bg:#fbfdfc; --floor:#fbf8ec; --porch:#efe9d3; --wall:#2c313a;
  --room:#fffdf5; --wet:#d9eafc; --lab:#e8defa; --service:#e6eedb; --hall:#f7e8c2; --meet:#cfe3fb; --stairs:#f0f1f3;
  --door:#1e88e5; --route:#1a73e8; --start:#188038; --end:#d93025; --label:#2a2f39; --sublabel:#586174;
  --shadow:0 2px 12px rgba(20,30,60,.16);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10141b; --panel:#181d27; --text:#e8ecf4; --muted:#9aa5b8; --line:#2a3140; --field:#222a38;
    --primary:#8ab4f8; --primary-ink:#0b1b33; --primary-soft:#23324d;
    --map-bg:#fbfdfc; --floor:#2a2f3a; --porch:#333a47; --wall:#c9d0dc;
    --room:#313846; --wet:#25405e; --lab:#3d3459; --service:#34412f; --hall:#4a4129; --meet:#26405f; --stairs:#2f3541;
    --door:#6fb1ff; --route:#8ab4f8; --start:#81c995; --end:#f28b82; --label:#e8ecf4; --sublabel:#a7b2c6;
    --shadow:0 2px 14px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#10141b; --panel:#181d27; --text:#e8ecf4; --muted:#9aa5b8; --line:#2a3140; --field:#222a38;
  --primary:#8ab4f8; --primary-ink:#0b1b33; --primary-soft:#23324d;
  --map-bg:#fbfdfc; --floor:#2a2f3a; --porch:#333a47; --wall:#c9d0dc;
  --room:#313846; --wet:#25405e; --lab:#3d3459; --service:#34412f; --hall:#4a4129; --meet:#26405f; --stairs:#2f3541;
  --door:#6fb1ff; --route:#8ab4f8; --start:#81c995; --end:#f28b82; --label:#e8ecf4; --sublabel:#a7b2c6;
  --shadow:0 2px 14px rgba(0,0,0,.5);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Inter,Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.4;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}

.app{display:grid;grid-template-columns:400px 1fr;grid-template-rows:auto 1fr;height:100%}
.ptop{grid-column:1;grid-row:1;background:var(--panel);padding:14px 16px 12px;z-index:3;border-bottom:1px solid var(--line)}
.pbottom{grid-column:1;grid-row:2;background:var(--panel);overflow:auto;min-height:0;padding:14px 16px 20px}
.mapwrap{grid-column:2;grid-row:1 / span 2;position:relative;min-height:0;background:var(--map-bg);overflow:hidden}

.brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center}
.brand h1{font-size:18px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.01em}
.brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.brand .grow{flex:1}
.icon-btn{border:0;background:var(--field);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px}
.icon-btn:hover{background:var(--primary-soft)}

.route-card{display:grid;grid-template-columns:22px 1fr 40px;gap:8px;align-items:center;background:var(--field);border-radius:14px;padding:10px 8px 10px 12px}
.pts{display:flex;flex-direction:column;align-items:center;gap:3px}
.dot{width:12px;height:12px;border-radius:50%}
.dot.s{border:3px solid var(--start);background:var(--panel)}
.dot.e{background:var(--end);width:12px;height:12px;border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
.vline{width:2px;height:16px;background:repeating-linear-gradient(var(--muted) 0 3px,transparent 3px 6px)}
.fields{display:flex;flex-direction:column;gap:8px}
select{width:100%;min-height:44px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:0 10px;appearance:auto}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip-btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;min-height:40px;padding:0 14px;font-weight:500}
.chip-btn:hover{background:var(--primary-soft)}
.primary{width:100%;margin-top:10px;min-height:48px;border:0;border-radius:12px;background:var(--primary);color:var(--primary-ink);font-weight:600;font-size:15px}
.primary:hover{filter:brightness(1.07)}
.tabs{display:flex;gap:4px;margin-top:12px;background:var(--field);border-radius:12px;padding:4px}
.tab{flex:1;min-height:40px;border:0;background:transparent;border-radius:9px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15)}

.empty{color:var(--muted);padding:18px 4px;text-align:center}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.summary{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.summary .big{font-size:26px;font-weight:700;letter-spacing:-.02em;color:var(--primary)}
.summary .sub{color:var(--muted)}
.actions{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:600}
.btn.fill{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn:hover{filter:brightness(.97)}
.steps{list-style:none;margin:10px 0 0;padding:0}
.step{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:10px 8px;border-radius:12px;align-items:start}
.step + .step{border-top:1px solid var(--line)}
.step .ic{width:36px;height:36px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-size:18px;font-weight:700}
.step.active{background:var(--primary-soft)}
.step.active .ic{background:var(--primary);color:var(--primary-ink)}
.step .t{font-weight:600}
.step .d{color:var(--muted);font-size:13px}

.search{width:100%;min-height:44px;border:1px solid var(--line);background:var(--field);border-radius:12px;padding:0 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chips button{border:1px solid var(--line);background:var(--panel);border-radius:999px;min-height:34px;padding:0 12px;font-size:13px;font-weight:500}
.chips button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.list{list-style:none;margin:0;padding:0}
.li{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--line)}
.li .n{flex:1;min-width:0}
.li .n b{display:block;font-weight:600}
.li .n span{color:var(--muted);font-size:12px}
.mini{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:600}
.mini.go{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}

svg#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
svg#map.dragging{cursor:grabbing}
.bg{fill:var(--map-bg)} .floor{fill:var(--floor)} .porch{fill:var(--porch)}
.f-ground{fill:url(#hatch)} .f-room{fill:var(--room)} .f-wet{fill:var(--wet)} .f-lab{fill:var(--lab)} .f-service{fill:var(--service)} .f-hall{fill:var(--hall)} .f-meet{fill:var(--meet)} .f-stairs{fill:var(--stairs)}
.bg,.floor,.porch,.walls{pointer-events:none}
.walls rect,.walls path,.walls ellipse{fill:none;stroke:var(--wall);stroke-linejoin:miter}
.place .hit{stroke:transparent;stroke-width:3;cursor:pointer}
.place:hover .hit{stroke:#e8710a;stroke-width:2.5}
.place.sel .hit{stroke:#e8710a;stroke-width:4;fill:rgba(232,113,10,.16)}
.place.is-start .hit{stroke:#188038;stroke-width:4;fill:rgba(24,128,56,.18)}
.place.is-end .hit{stroke:#d93025;stroke-width:4;fill:rgba(217,48,37,.16)}
.lbl{font-family:Inter,Roboto,system-ui,sans-serif;text-anchor:middle;fill:var(--label);pointer-events:none;font-weight:600}
.lbl .sz{fill:var(--sublabel);font-weight:400}
.stair-line{stroke:var(--wall);stroke-width:1.4;opacity:.6}
.route-halo{fill:none;stroke:#fff;stroke-width:12;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.route-line{fill:none;stroke:#1a5fd0;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.route-flow{fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 14;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}
.you-pulse{fill:#1a5fd0;opacity:.25;animation:pulse 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{from{transform:scale(.6);opacity:.5}to{transform:scale(2.2);opacity:0}}
@media (prefers-reduced-motion: reduce){.route-flow,.you-pulse{animation:none}}

.overlay{position:absolute;z-index:2}
.zoom{right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.zoom button{width:44px;height:44px;border:0;background:transparent;font-size:22px;font-weight:500}
.zoom button + button{border-top:1px solid var(--line)}
.zoom button:hover{background:var(--primary-soft)}
.compass{right:12px;top:12px;width:48px;height:48px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);display:grid;place-items:center}
.scale{left:12px;bottom:12px;background:var(--panel);box-shadow:var(--shadow);border-radius:8px;padding:4px 8px 6px;font-size:11px;color:var(--muted)}
.scale i{display:block;height:6px;border:2px solid var(--text);border-top:0;margin-top:2px}
.selcard{left:12px;right:70px;bottom:52px;max-width:420px;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px}
.selcard h3{margin:0;font-size:16px}
.selcard p{margin:2px 0 10px;color:var(--muted);font-size:13px}
.selcard .row{margin:0}
.selcard .x{position:absolute;right:6px;top:6px;width:36px;height:36px;border:0;background:transparent;font-size:18px;border-radius:50%}
.banner{left:12px;right:70px;top:12px;max-width:520px;background:var(--primary);color:var(--primary-ink);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;display:flex;align-items:center;gap:12px}
.banner .ic{font-size:26px;width:36px;text-align:center}
.banner .tx{flex:1;min-width:0}
.banner b{display:block;font-size:16px;line-height:1.2}
.banner span{font-size:13px;opacity:.9}
.banner button{border:0;border-radius:999px;min-height:40px;padding:0 14px;font-weight:600;background:rgba(255,255,255,.2);color:inherit}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#202636;color:#fff;border-radius:999px;padding:10px 18px;z-index:20;box-shadow:var(--shadow);max-width:90vw;font-size:13px}
[hidden]{display:none !important}

@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto auto;height:auto;min-height:100%}
  .ptop{grid-column:1;grid-row:1}
  .mapwrap{grid-column:1;grid-row:2;height:58vh;min-height:340px}
  .pbottom{grid-column:1;grid-row:3;overflow:visible}
  .selcard{right:70px}
}
</style>
</head>
<body>
<div class="app">
  <section class="ptop" aria-label="Route planner">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg></div>
      <div class="grow"><h1>CampusNav</h1><p>K.S.R. College of Engineering · Ground floor</p></div>
      <button class="icon-btn" id="themeBtn" aria-label="Switch light or dark theme" title="Theme">☾</button>
    </div>

    <div class="route-card">
      <div class="pts" aria-hidden="true"><span class="dot s"></span><span class="vline"></span><span class="dot e"></span></div>
      <div class="fields">
        <select id="selFrom" aria-label="Starting point"></select>
        <select id="selTo" aria-label="Destination"></select>
      </div>
      <button class="icon-btn" id="swap" aria-label="Swap start and destination" title="Swap">⇅</button>
    </div>
    <div class="row"><button class="chip-btn" id="useEntrance">📍 Start from Entrance</button></div>
    <button class="primary" id="go">Get directions</button>

    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabDir" aria-selected="true">Directions</button>
      <button class="tab" role="tab" id="tabRooms" aria-selected="false">All rooms</button>
    </div>
  </section>

  <section class="mapwrap" aria-label="Floor plan">
    <svg id="map" role="img" aria-label="Interactive floor plan. Drag to pan, scroll or pinch to zoom, tap a room to select it."></svg>

    <div class="overlay compass" aria-label="North is up" title="North is up">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 3l5 12h-10z" fill="#d93025"/><path d="M15 27l5-12h-10z" fill="#9aa5b8"/><circle cx="15" cy="15" r="1.8" fill="#fff"/><text x="15" y="2" font-size="0" fill="none">N</text></svg>
    </div>
    <div class="overlay zoom">
      <button id="zin" aria-label="Zoom in">+</button>
      <button id="zout" aria-label="Zoom out">−</button>
      <button id="zfit" aria-label="Fit whole floor" title="Fit">⤢</button>
    </div>
    <div class="overlay scale" id="scale"><span id="scaleTxt">5 m</span><i id="scaleBar" style="width:100px"></i></div>

    <div class="overlay banner" id="banner" hidden>
      <div class="ic" id="bIcon">↑</div>
      <div class="tx"><b id="bTitle"></b><span id="bSub"></span></div>
      <button id="bEnd">End</button>
    </div>
    <div class="overlay selcard" id="selcard" hidden>
      <button class="x" id="selX" aria-label="Close">✕</button>
      <h3 id="selName"></h3><p id="selMeta"></p>
      <div class="row"><button class="mini" id="selStart">Start here</button><button class="mini go" id="selGo">Directions here</button></div>
    </div>
  </section>

  <section class="pbottom" id="pbottom" aria-live="polite"></section>
</div>
<div class="toast" id="toast" hidden></div>

// ----- view / zoom / pan -----
function applyView(){
  const cw=svg.clientWidth||800,chh=svg.clientHeight||600,v=state.view,h=v.w*chh/cw;
  svg.setAttribute('viewBox',`${v.cx-v.w/2} ${v.cy-h/2} ${v.w} ${h}`);
  const upp=v.w/cw,pxm=PX_PER_M/upp;
  let m=[1,2,5,10,20].find(k=>k*pxm>=60)||20;
  $('scaleTxt').textContent=m+' m';$('scaleBar').style.width=(m*pxm)+'px';
}
function fitBounds(x1,y1,x2,y2,pad){
  const cw=svg.clientWidth||800,chh=svg.clientHeight||600,asp=chh/cw;
  const w=Math.max((x2-x1)+2*pad,((y2-y1)+2*pad)/asp);
  state.view={cx:(x1+x2)/2,cy:(y1+y2)/2,w:Math.min(1500,Math.max(260,w))};applyView();
}
const fitAll=()=>fitBounds(0,0,1280,1000,0);
function zoomAt(cx,cy,f){
  const r=svg.getBoundingClientRect(),v=state.view,upp=v.w/r.width;
  const ox=cx-r.left-r.width/2,oy=cy-r.top-r.height/2;
  const px=v.cx+ox*upp,py=v.cy+oy*upp;
  const nw=Math.min(1500,Math.max(220,v.w*f)),nu=nw/r.width;
  state.view={cx:px-ox*nu,cy:py-oy*nu,w:nw};applyView();
}
const ptrs=new Map();let moved=0,pinch=0;
const pdist=()=>{const a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);};
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptrs.size===1)moved=0;if(ptrs.size===2)pinch=pdist();svg.classList.add('dragging');});
svg.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  if(ptrs.size===1){
    const upp=state.view.w/svg.clientWidth,dx=e.clientX-p.x,dy=e.clientY-p.y;
    moved+=Math.abs(dx)+Math.abs(dy);
    state.view.cx-=dx*upp;state.view.cy-=dy*upp;p.x=e.clientX;p.y=e.clientY;applyView();
  }else if(ptrs.size===2){
    p.x=e.clientX;p.y=e.clientY;const nd=pdist(),a=[...ptrs.values()];
    if(pinch&&nd)zoomAt((a[0].x+a[1].x)/2,(a[0].y+a[1].y)/2,pinch/nd);pinch=nd;moved+=10;
  }
});
function endPtr(e){
  const tap=ptrs.size===1&&moved<8&&e.type==='pointerup';
  ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=0;if(!ptrs.size)svg.classList.remove('dragging');
  if(tap){const el=document.elementFromPoint(e.clientX,e.clientY),g=el&&el.closest&&el.closest('.place');if(g&&svg.contains(g))selectPlace(g.dataset.id);}
}
svg.addEventListener('pointerup',endPtr);svg.addEventListener('pointercancel',endPtr);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,Math.exp(e.deltaY*0.0016));},{passive:false});
$('zin').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,0.7);};
$('zout').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1.4);};
$('zfit').onclick=()=>state.route?fitRoute():fitAll();
window.addEventListener('resize',applyView);

// ----- selection card -----
function selectPlace(id){
  state.selected=id;const p=byId[id];
  $('selName').textContent=p.name;
  $('selMeta').textContent=[p.cat,p.size].filter(Boolean).join(' · ');
  $('selcard').hidden=false;highlight();
}
function closeSel(){state.selected=null;$('selcard').hidden=true;highlight();}
$('selX').onclick=closeSel;
$('selStart').onclick=()=>{setFrom(state.selected);closeSel();};
$('selGo').onclick=()=>{setTo(state.selected);closeSel();};
function highlight(){
  svg.querySelectorAll('.place').forEach(g=>{
    const id=g.dataset.id;
    g.classList.toggle('sel',id===state.selected);
    g.classList.toggle('is-start',id===state.from);
    g.classList.toggle('is-end',id===state.to);
  });
}

// ----- form -----
function fillSelects(){
  const opt=(ph)=>`<option value="">${ph}</option>`+cats.map(c=>{
    const list=places.filter(p=>p.cat===c).sort((a,b)=>a.name.localeCompare(b.name));
    return `<optgroup label="${c}">${list.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</optgroup>`;
  }).join('');
  $('selFrom').innerHTML=opt('Choose starting point');
  $('selTo').innerHTML=opt('Choose destination');
}
function setFrom(id){state.from=id||'';$('selFrom').value=state.from;update();}
function setTo(id){state.to=id||'';$('selTo').value=state.to;update();}
$('selFrom').onchange=e=>setFrom(e.target.value);
$('selTo').onchange=e=>setTo(e.target.value);
$('swap').onclick=()=>{const f=state.from;state.from=state.to;state.to=f;$('selFrom').value=state.from;$('selTo').value=state.to;update();};
$('useEntrance').onclick=()=>setFrom('gate');
$('go').onclick=()=>{if(!state.from||!state.to){toast('Choose both a starting point and a destination.');return;}update(true);};
$('themeBtn').onclick=()=>{
  const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const nx=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=nx;$('themeBtn').textContent=nx==='dark'?'☀':'☾';
};
let toastT;function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200);}

// ----- routing -----
function fitRoute(){
  const xs=state.route.pts.map(p=>p[0]),ys=state.route.pts.map(p=>p[1]);
  fitBounds(Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys),70);
}
function update(refit){
  stopNav();state.route=null;
  if(state.from&&state.to){
    if(state.from===state.to){toast('Start and destination are the same place.');}
    else{
      const a=byId[state.from],b=byId[state.to],pts=findRoute(a.pt,b.pt);
      if(pts){state.route={pts,len:lenOf(pts),steps:buildSteps(pts,a,b)};}
      else toast('No walkable route found between these places.');
    }
  }
  drawRoute();highlight();renderBottom();
  if(state.route&&refit!==false)fitRoute();
}
function drawRoute(){
  const L=$('routeLayer');if(!L)return;
  const r=state.route;
  let s='';
  if(r){
    const d='M'+r.pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L');
    s+=`<path class="route-halo" d="${d}"/><path class="route-line" d="${d}"/><path class="route-flow" d="${d}"/>`;
    const a=r.pts[0],b=r.pts[r.pts.length-1];
    s+=`<circle cx="${a[0]}" cy="${a[1]}" r="10" fill="var(--start)" stroke="#fff" stroke-width="3.5"/><circle cx="${a[0]}" cy="${a[1]}" r="3.5" fill="#fff"/>`;
    s+=`<g transform="translate(${b[0]} ${b[1]})"><path d="M0 0C-10 -14 -15 -22 -15 -29a15 15 0 1 1 30 0c0 7 -5 15 -15 29z" fill="var(--end)" stroke="#fff" stroke-width="2.5"/><circle cy="-29" r="5.5" fill="#fff"/></g>`;
    s+=`<g id="you" hidden><circle class="you-pulse" r="12"/><circle r="9" fill="#1a5fd0" stroke="#fff" stroke-width="3.5"/></g>`;
  }
  L.innerHTML=s;
}

// ----- turn-by-turn -----
const WIND=['north','north-east','east','south-east','south','south-west','west','north-west'];
const headingOf=(a,b)=>((Math.atan2(b[0]-a[0],-(b[1]-a[1]))*180/Math.PI)+360)%360;
const windName=h=>WIND[Math.round(h/45)%8];
function distToRect(p,r){const dx=Math.max(r[0]-p[0],0,p[0]-r[2]),dy=Math.max(r[1]-p[1],0,p[1]-r[3]);return Math.hypot(dx,dy);}
function landmark(g,from,to){
  const m=[(g.a[0]+g.b[0])/2,(g.a[1]+g.b[1])/2];
  let best=null,bd=48;
  rooms.forEach(r=>{
    if(r.id===from.id||r.id===to.id)return;
    const d=distToRect(m,r.rect);if(d<bd){bd=d;best=r;}
  });
  if(!best)return '';
  const h=g.h*Math.PI/180,hx=Math.sin(h),hy=-Math.cos(h),vx=best.pt[0]-m[0],vy=best.pt[1]-m[1];
  const right=hx*vy-hy*vx>0;
  return `${best.name} on your ${right?'right':'left'}`;
}
function buildSteps(pts,from,to){
  const segs=[];
  for(let i=1;i<pts.length;i++){const l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);if(l>0.5)segs.push({a:pts[i-1],b:pts[i],len:l,h:headingOf(pts[i-1],pts[i])});}
  const groups=[];let cum=0;
  segs.forEach(sg=>{
    const g=groups[groups.length-1];
    if(g){
      const d=((sg.h-g.h+540)%360)-180;
      if(Math.abs(d)<28||sg.len<10){g.len+=sg.len;g.b=sg.b;g.h=headingOf(g.a,g.b);cum+=sg.len;return;}
    }
    groups.push({a:sg.a,b:sg.b,len:sg.len,h:sg.h,startD:cum});cum+=sg.len;
  });
  const steps=[];
  groups.forEach((g,i)=>{
    let icon='↑',txt;
    if(i===0){icon='➤';txt=`Leave ${from.name} and head ${windName(g.h)}`;}
    else{
      const d=((g.h-groups[i-1].h+540)%360)-180,ad=Math.abs(d),right=d>0;
      if(ad<28){icon='↑';txt='Continue straight';}
      else if(ad<70){icon=right?'↗':'↖';txt=`Turn slightly ${right?'right':'left'}`;}
      else if(ad<135){icon=right?'↱':'↰';txt=`Turn ${right?'right':'left'}`;}
      else{icon='↩';txt='Turn around';}
    }
    const lm=landmark(g,from,to);
    steps.push({icon,txt:`${txt}`,dist:g.len,startD:g.startD,detail:`Walk ${meters(g.len)} m${lm?' · '+lm:''}`});
  });
  steps.push({icon:'⚑',txt:`Arrive at ${to.name}`,dist:0,startD:cum,detail:'You have reached your destination'});
  return steps;
}

// ----- bottom panel -----
function renderBottom(){
  const el=$('pbottom');
  if(state.tab==='rooms'){renderRooms();return;}
  const r=state.route;
  if(!r){
    el.innerHTML=`<div class="empty"><b>Where to?</b>Pick a start and destination above, or tap any room on the map to select it.</div>`;
    return;
  }
  const mins=Math.round(r.len/PX_PER_M/1.25/60*10)/10,t=mins<1?'Under 1 min':`${Math.max(1,Math.round(mins))} min`;
  el.innerHTML=`<div class="summary"><span class="big">${meters(r.len)} m</span><span class="sub">${t} on foot · ${byId[state.from].name} to ${byId[state.to].name}</span></div>
  <div class="actions"><button class="btn fill" id="startNav">Start navigation</button><button class="btn" id="clear">Clear</button></div>
  <ol class="steps" id="steps">${r.steps.map((s,i)=>`<li class="step" data-i="${i}"><span class="ic" aria-hidden="true">${s.icon}</span><div><div class="t">${esc(s.txt)}</div><div class="d">${esc(s.detail)}</div></div></li>`).join('')}</ol>`;
  $('startNav').onclick=startNav;
  $('clear').onclick=()=>{state.from='';state.to='';$('selFrom').value='';$('selTo').value='';setHash('');update(false);fitAll();};
  el.querySelectorAll('.step').forEach(li=>li.onclick=()=>{const s=r.steps[+li.dataset.i];const p=posAt(s.startD);zoomTo(p,380);});
}
function zoomTo(p,w){state.view={cx:p[0],cy:p[1],w};applyView();}
function renderRooms(){
  const el=$('pbottom');
  const q=state.q.toLowerCase();
  const list=places.filter(p=>(state.filter==='All'||p.cat===state.filter)&&p.name.toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));
  el.innerHTML=`<input class="search" id="q" type="search" placeholder="Search rooms" value="${esc(state.q)}" aria-label="Search rooms">
  <div class="chips">${['All',...cats].map(c=>`<button data-c="${c}" aria-pressed="${state.filter===c}">${c}</button>`).join('')}</div>
  <ul class="list">${list.map(p=>`<li class="li"><div class="n"><b>${esc(p.name)}</b><span>${[p.cat,p.size].filter(Boolean).join(' · ')}</span></div><button class="mini" data-s="${p.id}">Start</button><button class="mini go" data-g="${p.id}">Go</button></li>`).join('')||'<li class="empty">No rooms match.</li>'}</ul>`;
  const q$=$('q');q$.oninput=e=>{state.q=e.target.value;const pos=e.target.selectionStart;renderRooms();const n=$('q');n.focus();n.setSelectionRange(pos,pos);};
  el.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{state.filter=b.dataset.c;renderRooms();});
  el.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{setFrom(b.dataset.s);toast('Start set to '+byId[b.dataset.s].name);});
  el.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{setTo(b.dataset.g);if(state.route)setTab('dir');else toast('Destination set to '+byId[b.dataset.g].name);});
}
function setTab(t){
  state.tab=t;$('tabDir').setAttribute('aria-selected',t==='dir');$('tabRooms').setAttribute('aria-selected',t==='rooms');renderBottom();
}
$('tabDir').onclick=()=>setTab('dir');$('tabRooms').onclick=()=>setTab('rooms');

function setHash(h){try{history.replaceState(null,'',h?'#'+h:location.href.split('#')[0]);}catch(e){}}
function shareRoute(){
  const url=location.href.split('#')[0]+`#from=${state.from}&to=${state.to}`;
  setHash(`from=${state.from}&to=${state.to}`);
  (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(url):Promise.reject()).then(()=>toast('Route link copied'),()=>toast('Link ready in the address bar'));
}

// ----- live navigation simulation -----
function posAt(d){
  const pts=state.route.pts;let acc=0;
  for(let i=1;i<pts.length;i++){
    const l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
    if(acc+l>=d||i===pts.length-1){const t=l?Math.min(1,Math.max(0,(d-acc)/l)):0;return [pts[i-1][0]+(pts[i][0]-pts[i-1][0])*t,pts[i-1][1]+(pts[i][1]-pts[i-1][1])*t];}
    acc+=l;
  }
  return pts[0];
}
let raf=0;
function startNav(){
  if(!state.route)return;
  stopNav();
  state.nav={d:0,last:performance.now()};
  $('banner').hidden=false;$('selcard').hidden=true;
  const you=$('you');if(you)you.hidden=false;
  const loop=now=>{
    const n=state.nav;if(!n)return;
    n.d=Math.min(state.route.len,n.d+(now-n.last)/1000*200);n.last=now;
    const p=posAt(n.d),y=$('you');if(y)y.setAttribute('transform',`translate(${p[0]} ${p[1]})`);
    const v=state.view;state.view={cx:v.cx+(p[0]-v.cx)*0.25,cy:v.cy+(p[1]-v.cy)*0.25,w:v.w+(420-v.w)*0.15};applyView();
    const steps=state.route.steps;let k=0;steps.forEach((s,i)=>{if(s.startD<=n.d+0.5)k=i;});
    const done=n.d>=state.route.len-0.5,st=steps[done?steps.length-1:k];
    $('bIcon').textContent=st.icon;$('bTitle').textContent=st.txt;
    $('bSub').textContent=done?'You have arrived':`${meters(Math.max(0,state.route.len-n.d))} m left`;
    document.querySelectorAll('.step').forEach((li,i)=>li.classList.toggle('active',i===(done?steps.length-1:k)));
    if(done){raf=0;return;}
    raf=requestAnimationFrame(loop);
  };
  raf=requestAnimationFrame(loop);
}
function stopNav(){
  cancelAnimationFrame(raf);raf=0;state.nav=null;$('banner').hidden=true;
  const y=$('you');if(y)y.hidden=true;
  document.querySelectorAll('.step.active').forEach(l=>l.classList.remove('active'));
}
$('bEnd').onclick=()=>{stopNav();if(state.route)fitRoute();};

// ----- init -----
buildMap();fillSelects();applyView();fitAll();renderBottom();
(function(){
  const m=location.hash.match(/from=([\w]+)&to=([\w]+)/);
  if(m&&byId[m[1]]&&byId[m[2]]){state.from=m[1];state.to=m[2];$('selFrom').value=m[1];$('selTo').value=m[2];update();}
})();
requestAnimationFrame(()=>{applyView();if(state.route)fitRoute();else fitAll();});
</script>
</body>
